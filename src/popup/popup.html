<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="tutorial">
    <h1 class="brand-title">Tempo</h1>
    <section class="shortcut-section" aria-labelledby="shortcut-title">
      <h2 id="shortcut-title">Atalhos do teclado</h2>
      <div class="shortcut-row">
        <span class="key">A</span>
        <span>Diminuir velocidade</span>
        <span class="step">−0,10×</span>
      </div>
      <div class="shortcut-row">
        <span class="key">D</span>
        <span>Aumentar velocidade</span>
        <span class="step">+0,10×</span>
      </div>
      <div class="shortcut-row">
        <span class="key">H</span>
        <span>Mostrar ou ocultar o painel</span>
        <span class="step">liga/desliga</span>
      </div>
    </section>

    <section class="tip" aria-label="Dica">
      <p>No painel do vídeo, use <strong>«</strong> e <strong>»</strong> para voltar ou avançar 10 segundos. Arraste o indicador para reposicioná-lo.</p>
    </section>
    <footer>Os atalhos funcionam enquanto você navega pelo vídeo.</footer>
  </main>
</body>
</html>
