<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="display" id="current-speed">1.00</div>

  <div class="speed-grid">
    <button type="button" id="btn-rewind" title="Rewind 10s">«</button>
    <button type="button" id="btn-decrease" title="Decrease speed">-</button>
    <button type="button" id="btn-increase" title="Increase speed">+</button>
    <button type="button" id="btn-forward" title="Forward 10s">»</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
